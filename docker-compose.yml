version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  redis:
    image: redis:7-alpine
    profiles: ["live"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
